name: Option
description: |
  One entry in a selectable list.

  `value` is required. Without it the runtime falls back to an empty string,
  so two such entries carry the same value and selecting one selects both —
  the widget renders, reports nothing, and behaves wrongly. `label` falls back
  to `value`, so the reverse substitution does not exist.

  Other keys the runtime reads are declared with their types; a document may carry
  further keys, which the runtime ignores rather than refusing — an item shape
  that rejected an unknown key would break every document that carries one for
  its own bookkeeping.
definition:
  {
    "type": "object",
    "properties": {
      "value": {},
      "label": {
        "type": "string"
      },
      "binding": {
        "type": "string"
      },
      "icon": {
        "$ref": "#/$defs/IconRef"
      },
      "enabled": {
        "type": "boolean"
      }
    },
    "required": [
    "value"
  ],
  "additionalProperties": true
  }
