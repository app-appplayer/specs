name: NavItem
description: |
  One destination in a navigation surface.

  Keys the runtime reads are declared with their types; a document may carry
  further keys, which the runtime ignores rather than refusing — an item shape
  that rejected an unknown key would break every document that carries one for
  its own bookkeeping.
definition:
  {
    "type": "object",
    "properties": {
      "label": {
        "type": "string"
      },
      "title": {
        "type": "string"
      },
      "icon": {
        "$ref": "#/$defs/IconRef"
      },
      "activeIcon": {
        "$ref": "#/$defs/IconRef"
      },
      "backgroundColor": {
        "$ref": "#/$defs/Color"
      },
      "tooltip": {
        "type": "string"
      },
      "route": {
        "type": "string"
      }
    },
    "additionalProperties": true
  }
