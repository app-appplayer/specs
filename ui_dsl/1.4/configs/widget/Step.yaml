name: Step
description: |
  One step of a stepper.

  Keys the runtime reads are declared with their types; a document may carry
  further keys, which the runtime ignores rather than refusing — an item shape
  that rejected an unknown key would break every document that carries one for
  its own bookkeeping.
definition:
  {
    "type": "object",
    "properties": {
      "title": {
        "type": "string"
      },
      "titleText": {
        "type": "string"
      },
      "subtitle": {
        "type": "string"
      },
      "content": {
        "$ref": "#/$defs/Widget"
      },
      "state": {
        "type": "string"
      },
      "isActive": {
        "type": "boolean"
      }
    },
    "additionalProperties": true
  }
