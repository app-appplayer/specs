name: SnackBarAction
description: |
  The action offered alongside a snack bar message.

  Keys the runtime reads are declared with their types; a document may carry
  further keys, which the runtime ignores rather than refusing — an item shape
  that rejected an unknown key would break every document that carries one for
  its own bookkeeping.
definition:
  {
    "type": "object",
    "properties": {
      "label": {
        "type": "string"
      },
      "onPressed": {
        "$ref": "#/$defs/Action"
      },
      "onTap": {
        "$ref": "#/$defs/Action"
      },
      "textColor": {
        "$ref": "#/$defs/Color"
      }
    },
    "additionalProperties": true
  }
