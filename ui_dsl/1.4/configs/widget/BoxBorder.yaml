name: BoxBorder
description: |
  Border around a box. Either a single uniform side applied to all four
  edges, or per-side overrides. Per-side keys (`top` / `bottom` /
  `left` / `right`) take precedence over `all`.

  A per-side key may also be `true`, which draws that edge with the side
  described by the sibling `color` / `width` / `style` keys — the shorthand a
  document reaches for when only one edge is wanted.
definition:
  {
    "anyOf": [
      { "$ref": "#/$defs/BorderSide" },
      {
        "type": "object",
        "properties": {
          "top": { "oneOf": [ { "$ref": "#/$defs/BorderSide" }, { "type": "boolean" } ] },
          "bottom": { "oneOf": [ { "$ref": "#/$defs/BorderSide" }, { "type": "boolean" } ] },
          "left": { "oneOf": [ { "$ref": "#/$defs/BorderSide" }, { "type": "boolean" } ] },
          "right": { "oneOf": [ { "$ref": "#/$defs/BorderSide" }, { "type": "boolean" } ] },
          "all": { "$ref": "#/$defs/BorderSide" },
          "color": { "$ref": "#/$defs/Color" },
          "width": { "type": "number", "minimum": 0 },
          "style": { "enum": ["solid", "none"] }
        },
        "additionalProperties": false
      }
    ]
  }
