type: bottomNavigation
category: navigation
profile: Core
aliases:
  - bottomNav
  - bottomnavigationbar
description: |
  Bottom navigation bar. Each item's text field is `label`.
properties:
  fixedColor:
    type: Color
    description: "Colour of the selected item when the bar is in fixed mode."
  selectedFontSize:
    type: Dimension
    description: "Label size for the selected item."
  selectedIconTheme:
    type: "object"
    description: "Icon size / colour for the selected item."
  selectedItemColor:
    type: Color
    description: "Colour of the selected item."
  selectedLabelStyle:
    type: TextStyle
    description: "Text style for the selected label."
  showSelectedLabels:
    type: "boolean"
    description: "Whether the selected item shows its label."
  showUnselectedLabels:
    type: "boolean"
    description: "Whether unselected items show their labels."
  unselectedFontSize:
    type: Dimension
    description: "Label size for the items that are not selected."
  unselectedIconTheme:
    type: "object"
    description: "Icon size / colour for the items that are not selected."
  unselectedItemColor:
    type: Color
    description: "Colour of the items that are not selected."
  unselectedLabelStyle:
    type: TextStyle
    description: "Text style for the labels that are not selected."
  enableFeedback:
    type: "boolean"
    description: "Play the platform tap sound / haptic on activation."
  iconSize:
    type: Dimension
    description: "Rendered size of the icon."
  selectedIndex:
    type: "number | binding"
    default: 0
    description: "Currently selected index. Defaults to 0 when omitted."
  items:
    type: "array<NavItem>"
    required: true
    description: "`{ icon, label, route? }` entries."
  onChange:
    type: "Action"
    description: "Fired when selection changes."
  backgroundColor:
    type: Color
    description: "Legacy alias of `color`."
  change:
    type: Action
    description: "Legacy alias of `onChange`."
  elevation:
    type: Dimension
    description: "Shadow depth of the bar."
  onTap:
    type: Action
    description: "Fired when an item is tapped. `{{event.value}}` carries its index."
  currentIndex:
    type: "number"
    description: "Measured from real documents (2026-08-04): a zero-based tab index, or a binding to one — not a length."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "bottomNavigation",
        "selectedIndex": "{{currentTab}}",
        "items": [
          { "icon": "home",     "label": "Home" },
          { "icon": "search",   "label": "Search" },
          { "icon": "person",   "label": "Profile" }
        ],
        "onChange": {
          "type": "state", "action": "set",
          "binding": "currentTab", "value": "{{event.index}}"
        }
      }
