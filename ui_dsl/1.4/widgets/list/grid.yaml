type: grid
category: list
profile: Core
aliases:
  - gridview
description: |
  Scrollable two-dimensional collection.
properties:
  mainAxisExtent:
    type: Dimension
    description: "Fixed extent of each row along the scroll axis."
  maxCrossAxisExtent:
    type: Dimension
    description: "Widest a cell may be before the grid adds a column."
  padding:
    type: EdgeInsets
    description: "Space inside the surface, around its content."
  physics:
    type: "string"
    description: "Scroll response: `bouncing`, `clamping`, `never`, `always`."
  shrinkWrap:
    type: "boolean"
    description: "Size to the content instead of filling the viewport."
  spacing:
    type: Dimension
    description: "Gap between adjacent items."
  items:
    type: "array | binding"
    description: "Array source. Required when `children` is omitted."
  itemTemplate:
    type: "Widget"
    description: "Template rendered per bound item. Required with `items`."
  children:
    type: "array<Widget>"
    description: "Static grid cells. Mutually exclusive with `items` + `itemTemplate`."
  columns:
    type: "number | object"
    required: true
    description: "Column count. The object form is a responsive override keyed by form factor (§14.1.1) — `{compact, medium, expanded, large, extraLarge, default}`."
    aliases:
      - crossAxisCount
  rowGap:
    type: "number"
    default: 0
    description: "Gap between rows."
  columnGap:
    type: "number"
    default: 0
    description: "Gap between columns."
  itemAspectRatio:
    type: "number"
    description: "Fixed aspect ratio for each item."
  reverse:
    type: "boolean"
    description: "When true, run the transition in reverse direction (for back navigation)."
  scrollDirection:
    type: "string"
    description: "Scroll axis."
  template:
    type: ["object", "string"]
    description: "Template name to instantiate."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "grid",
        "items": "{{products}}",
        "columns": 2,
        "rowGap": 12,
        "columnGap": 12,
        "itemAspectRatio": 0.75,
        "itemTemplate": {
          "type": "card",
          "child": {
            "type": "linear", "direction": "vertical",
            "children": [
              { "type": "image", "src": "{{item.image}}", "fit": "cover" },
              { "type": "text",  "text": "{{item.name}}" }
            ]
          }
        }
      }
