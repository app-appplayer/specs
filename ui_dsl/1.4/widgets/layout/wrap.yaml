type: wrap
category: layout
profile: Core
description: |
  Flow layout that wraps children to the next line when they exceed available width/height.
properties:
  runAlignment:
    type: "string"
    description: "How the runs (lines) are aligned along the cross axis."
  verticalDirection:
    type: "string"
    description: "Order children are laid out vertically: `down` or `up`."
  clipBehavior:
    type: "string"
    description: "How content crossing the bounds is clipped."
  direction:
    type: "string"
    default: "horizontal"
    description: "Primary flow direction."
  spacing:
    type: "number"
    default: 0
    description: "Gap between children on the same run."
  runSpacing:
    type: "number"
    default: 0
    description: "Gap between runs."
  alignment:
    type: "string"
    default: "start"
    description: "Alignment within a run."
  children:
    type: "array<Widget>"
    required: true
    description: "Children to wrap."
  crossAxisAlignment:
    type: "string"
    description: "Legacy alias of `alignment`."
  textDirection:
    type: "string"
    description: "Resolution direction for `start`/`end` alignment."
# examples migrated verbatim from prose JSON fences.
