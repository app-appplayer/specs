type: numberField
category: input
profile: Core
aliases: [numberInput]
description: |
  Specialized input for numeric values. Shared rows per §2.6.0; `value` is `number`.
properties:
  error:
    type: "string"
    description: "Error message shown under the field."
  showStepper:
    type: boolean
    default: true
    description: "Render increment/decrement controls. False leaves keyboard entry only."
  label:
    type: "string"
    description: "Field label."
  min:
    type: "number"
    description: "Minimum value."
  max:
    type: "number"
    description: "Maximum value."
  step:
    type: "number"
    default: 1
    description: "Increment size."
  decimalPlaces:
    type: "number"
    default: 0
    description: "Decimal precision."
  prefix:
    type: "string"
    description: "Leading display text (e.g., `\"$\"`)."
  suffix:
    type: "string"
    description: "Trailing display text."
  thousandSeparator:
    type: ["boolean", "string"]
    description: "Thousands separator for display."
  change:
    type: Action
    description: "Legacy alias of `onChange`."
  format:
    type: "string"
    description: "Display format."
  helperText:
    type: "string"
    description: "Helper text shown below the field."
  hint:
    type: "string"
    description: "Legacy alias of `placeholder`."
# examples migrated verbatim from prose JSON fences.
