type: dateField
category: input
profile: Core
description: |
  Date input with calendar/text entry modes. Shared rows per §2.6.0; `value` is an ISO date string.
properties:
  errorText:
    type: "string"
    description: "Error message shown under the field. Overrides validation output."
  label:
    type: "string"
    description: "Field label."
  format:
    type: "string"
    default: "yyyy-MM-dd"
    description: "Display format."
  firstDate:
    type: "string"
    description: "Earliest allowed date (ISO)."
  lastDate:
    type: "string"
    description: "Latest allowed date (ISO)."
  mode:
    type: "string"
    enum: [calendar, input, both]
    default: "calendar"
    description: "`calendar`, `input`, `both`."
  locale:
    type: "string"
    description: "Locale identifier."
