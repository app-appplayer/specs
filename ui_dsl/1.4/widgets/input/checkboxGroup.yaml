type: checkboxGroup
category: input
profile: Core
description: |
  Multi-selection checkbox group. Shared rows per §2.6.0; `binding` holds an `array` of selected values (top-level, not per-option).
properties:
  label:
    type: "string"
    description: "Field label shown beside or above the control."
  options:
    type: "array<Option>"
    required: true
    description: "`{ value, label }` entries."
    aliases:
      - items
  orientation:
    type: "string"
    default: "vertical"
    description: "`vertical` or `horizontal`."
  change:
    type: Action
    description: "Legacy alias of `onChange`."
  direction:
    type: "string"
    description: "`horizontal` or `vertical`."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "checkboxGroup",
        "binding": "form.interests",
        "options": [
          { "value": "sports", "label": "Sports" },
          { "value": "music",  "label": "Music" }
        ]
      }
