type: colorPicker
category: input
profile: Core
description: |
  Color selection. Shared rows per §2.6.0; `value` is a hex color string.
properties:
  label:
    type: "string"
    description: "Field label shown beside or above the control."
  showAlpha:
    type: "boolean"
    default: false
    description: "Enable alpha channel."
  showLabel:
    type: "boolean"
    default: true
    description: "Show hex label."
  pickerType:
    type: "string"
    enum: [wheel, palette, both]
    default: "palette"
    description: |
      `wheel` (a continuous hue strip), `palette` (preset swatches), or
      `both`. The default is `palette` — what every picker has drawn since it
      shipped. The registry said `wheel` while no implementation did that, and
      changing the default would change screens that never named it.
  enableHistory:
    type: "boolean"
    default: false
    description: "Show recent colors."
# examples migrated verbatim from prose JSON fences.
