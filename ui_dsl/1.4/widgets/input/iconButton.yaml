type: iconButton
category: input
profile: Core
description: |
  Icon-only button for compact actions.
properties:
  fontFamily:
    type: "string"
    description: "Font family the icon glyph is taken from, for icon sets outside the default."
  disabledColor:
    type: Color
    description: "Colour used while the control is disabled."
  enableFeedback:
    type: "boolean"
    description: "Play the platform tap sound / haptic on activation."
  highlightColor:
    type: Color
    description: "Overlay while the surface is held down."
  iconSize:
    type: Dimension
    description: "Rendered size of the icon."
  padding:
    type: EdgeInsets
    description: "Space inside the surface, around its content."
  splashColor:
    type: Color
    description: "Colour of the ripple that expands from the touch point."
  splashRadius:
    type: Dimension
    description: "Radius the ripple expands to."
  icon:
    type: IconRef
    required: true
    description: "Icon shown. Any `IconRef` form."
  size:
    type: "number"
    description: "Icon size; uses theme default if omitted."
  color:
    type: Color
    description: "Icon color."
  enabled:
    type: "boolean"
    default: true
    description: "Whether the button is interactive."
  onTap:
    type: "Action"
    description: "Tap handler."
  alignment:
    type: Alignment
    description: "Where the icon sits inside the button bounds."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "iconButton",
        "icon": "favorite",
        "color": "#F44336",
        "onTap": { "type": "state", "action": "toggle", "binding": "isFavorite" }
      }
