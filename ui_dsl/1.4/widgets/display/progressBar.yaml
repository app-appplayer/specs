type: progressBar
category: display
profile: Core
aliases:
  - linearProgressIndicator
  - circularProgressIndicator
  - loadingIndicator
  - loading-indicator
  - progress-bar
  - progress
description: |
  Progress indicator (linear or circular).
properties:
  size:
    type: Dimension
    description: "Rendered size."
  strokeWidth:
    type: Dimension
    description: "Thickness of the drawn stroke."
  value:
    type: "number | binding"
    description: "Progress in `0.0..1.0`; omit for indeterminate."
  indicatorType:
    type: "string"
    default: "circular"
    description: |
      `linear` or `circular`. The widget type can name the shape instead:
      `linearProgressIndicator` and `circularProgressIndicator` are linear and
      circular respectively, and this property overrides either. Circular is
      the default because a bar has no intrinsic width — a bare `progressBar`
      inside a row asserts at layout time rather than rendering.
  color:
    type: Color
    default: "theme primary"
    description: "Foreground color."
  backgroundColor:
    type: Color
    description: "Track color."
# examples migrated verbatim from prose JSON fences.
examples:
