type: avatar
category: display
profile: Core
description: |
  Circular widget for user images or initials.
properties:
  src:
    type: AssetRef
    description: "Image source. Any `AssetRef` form; if absent or unresolvable, falls back to `label`."
  label:
    type: "string"
    description: "Text label (typically initials)."
    aliases:
      - text
  size:
    type: "number"
    default: 40
    description: "Diameter in logical pixels."
  color:
    type: Color
    description: "Background color when showing label."
    aliases:
      - backgroundColor
  backgroundImage:
    type: BackgroundImage
    description: "Image drawn behind the initials or icon."
  foregroundColor:
    type: Color
    description: "Bar color."
  icon:
    type: IconRef
    description: "Icon shown. Any `IconRef` form."
  radius:
    type: "number"
    description: "Radius of the circle, in logical pixels."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "avatar",
        "src": "https://example.com/user.jpg",
        "label": "JD",
        "size": 40,
        "color": "#2196F3"
      }
