type: draggable
category: interaction
profile: Core
description: |
  Drag source widget that produces drag data and feedback visuals.
properties:
  affinity:
    type: "string"
    description: "Axis this drag claims before competing gestures: `horizontal`, `vertical`."
  axis:
    type: "string"
    description: "Axis the drag is restricted to."
  dragAnchorStrategy:
    type: "string"
    description: "Where the dragged feedback sits relative to the pointer: `child` or `pointer`."
  onDragCompleted:
    type: Action
    description: "Fired when the drag ends on a target that accepted it."
  onDragEnd:
    type: Action
    description: "Fired when the drag ends, wherever it ended."
  onDragStarted:
    type: Action
    description: "Fired when the drag begins."
  onDraggableCanceled:
    type: Action
    description: "Fired when the drag ends without a target accepting it."
  data:
    type: "any | binding"
    required: true
    description: "Payload emitted on drop."
  feedback:
    type: "Widget"
    description: "Widget shown while dragging."
  childWhenDragging:
    type: "Widget"
    description: "Replacement for the source while dragging."
  child:
    type: "Widget"
    required: true
    description: "Source widget."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "draggable",
        "data": "{{item.id}}",
        "feedback": {
          "type": "card",
          "child": { "type": "text", "text": "{{item.name}}" }
        },
        "child": {
          "type": "listItem",
          "title": "{{item.name}}"
        }
      }
