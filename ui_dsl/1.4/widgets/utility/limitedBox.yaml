type: limitedBox
category: utility
profile: Core
description: |
  Limits a child's size only when it would otherwise be unbounded.
properties:
  maxWidth:
    type: "number"
    description: |
      Upper bound applied when the parent gives unbounded width. Omitted, no
      bound is applied — written as a number, so the "infinity" a Flutter
      implementation uses internally is not a value a document can carry.
  maxHeight:
    type: "number"
    description: |
      Upper bound applied when the parent gives unbounded height. Omitted, no
      bound is applied.
  child:
    type: "Widget"
    required: true
    description: "Bounded child."
