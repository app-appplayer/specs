type: dataTable
category: advanced
profile: Advanced
aliases: [dataGrid]
since: v1.0
description: |
  Material-style sortable, selectable data table bound to a row array.
properties:
  editable:
    type: boolean
    default: false
    description: "Allow in-place cell editing. Edits report through `onCellEdit`; the widget does not mutate `data` on its own."
  filterable:
    type: boolean
    default: false
    description: "Offer per-column filter controls."
  resizableColumns:
    type: boolean
    default: false
    description: "Allow dragging column edges to resize."
  virtualScroll:
    type: boolean
    default: false
    description: "Render only visible rows. Requires a fixed `rowHeight` — a virtualised list cannot measure rows it has not built."
  rowHeight:
    type: number
    description: "Fixed row height in logical pixels. Required when `virtualScroll` is true."
  columns:
    type: "array<Column>"
    required: true
    description: "Column definitions"
  columns[].key:
    type: "string"
    required: true
    description: "Row field key"
  columns[].label:
    type: "string"
    required: true
    description: "Header label"
  columns[].width:
    type: "number"
    default: null
    description: "Fixed column width"
  columns[].sortable:
    type: "boolean"
    default: false
    description: "Whether column supports sorting"
  columns[].align:
    type: "string"
    enum: ["start", "center", "end"]
    default: "start"
    description: "Horizontal text alignment."
  rows:
    type: "array<object> | binding"
    required: true
    description: "Array of row objects"
  selectable:
    type: "boolean"
    default: false
    description: "Whether rows are selectable"
  sortColumn:
    type: "string"
    default: null
    description: |
      Current sort column key. Declared `binding` before, which accepted
      `"{{sortColumn}}"` and rejected the key itself — a table sorted by a
      fixed column could not say so.
  sortAscending:
    type: "boolean"
    default: true
    description: |
      Current sort direction. `true` is ascending. Declared `binding` before,
      so writing the direction as the boolean the runtime reads was rejected
      at load.
  onSort:
    type: "Action"
    default: null
    description: "Fired on header tap of a sortable column"
  onCellEdit:
    type: Action
    default: null
    description: |
      Fired when an edited cell is committed. `event.row` is the row object,
      `event.column` its column key, `event.value` the new value and
      `event.previous` the old one. The widget does not mutate `rows` — the
      document decides what an edit means.
  onRowTap:
    type: "Action"
    default: null
    description: "Fired on row tap; `event.row` is the row object"
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "dataTable",
        "columns": [
          { "key": "id", "label": "ID", "width": 100 },
          { "key": "name", "label": "Name", "sortable": true },
          { "key": "status", "label": "Status", "align": "center" }
        ],
        "rows": "{{items}}",
        "selectable": true,
        "sortColumn": "{{sortColumn}}",
        "sortAscending": "{{sortAscending}}",
        "onSort": {
          "type": "batch",
          "actions": [
            { "type": "state", "action": "set", "binding": "sortColumn", "value": "{{event.column}}" },
            { "type": "state", "action": "set", "binding": "sortAscending", "value": "{{event.ascending}}" }
          ]
        },
        "onRowTap": {
          "type": "navigation",
          "action": "push",
          "route": "/detail/{{event.row.id}}"
        }
      }
