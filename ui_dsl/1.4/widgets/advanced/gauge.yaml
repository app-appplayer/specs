type: gauge
category: advanced
profile: Advanced
aliases: [meter]
since: v1.0
description: |
  Radial gauge for a value within a range.
properties:
  value:
    type: "number"
    required: true
    description: "Current value"
  min:
    type: "number"
    default: 0
    description: "Range minimum"
  max:
    type: "number"
    default: 100
    description: "Range maximum"
  segments:
    type: "array<Segment>"
    default: null
    description: "Color segments with `from`, `to`, `color`"
  size:
    type: "number"
    default: 200
    description: "Diameter (logical px)"
  strokeWidth:
    type: "number"
    default: 10
    description: "Arc thickness in logical pixels."
  backgroundColor:
    type: Color
    default: "#E0E0E0"
    description: "Track color"
  valueColor:
    type: Color
    default: "theme primary"
    description: "Value arc color (when no segments)"
  showLabel:
    type: "boolean"
    default: true
    description: "Show numeric label"
  labelFormat:
    type: "string"
    default: "{value}%"
    description: |
      Label pattern; `{value}` is replaced by the reading. The default carries
      the per-cent sign because that is what every gauge written so far has
      been drawing — a gauge of something else writes its own pattern.
  startAngle:
    type: "number"
    default: -220
    description: |
      Start angle in degrees, measured the way the painter does: `-220` with a
      sweep of `260` is the open-bottom dial these gauges have always drawn.
  sweepAngle:
    type: "number"
    default: 260
    description: "Sweep span in degrees."
# examples migrated verbatim from prose JSON fences.
examples:
  - name: prose_example_0
    dsl: |
      {
        "type": "gauge",
        "value": 72,
        "min": 0,
        "max": 100,
        "segments": [
          { "from": 0, "to": 30, "color": "#F44336" },
          { "from": 30, "to": 70, "color": "#FF9800" },
          { "from": 70, "to": 100, "color": "#4CAF50" }
        ],
        "size": 200,
        "strokeWidth": 20,
        "showLabel": true,
        "labelFormat": "{value}%",
        "startAngle": 135,
        "sweepAngle": 270
      }
